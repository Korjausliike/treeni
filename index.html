<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563c9">
<title>Treeniloki</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #dfe3ea; --head: #eef1f6;
  --accent: #2563c9; --accent-soft: #dbe7fb; --ok: #2f9e55; --warn: #b87400; --bad: #d23c3c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181e; --panel: #1d2129; --text: #e4e7ee; --muted: #8e96a8; --line: #2e3440; --head: #252a34;
    --accent: #6aa0ff; --accent-soft: #24324d; --ok: #4fbf78; --warn: #e0a030; --bad: #ef6a6a; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
main { max-width: 560px; margin: 0 auto; padding: 10px 12px 28px; display: flex; flex-direction: column; gap: 10px; }
#app { display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 2px; }
header h1 { margin: 0; font-size: 17px; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lbl { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }

.today { border-color: var(--accent); background: var(--accent-soft); }
.today .big { font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.today .what { font-size: 17px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.done { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13.5px; }
.done b { color: var(--ok); }
.next .big { font-size: 19px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.wk h2 { margin: 0; font-size: 15px; }
.wk .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px; margin: 10px 0 4px; }
.tile .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

.days { margin: 8px -14px -4px; }
.day { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 14px; border-top: 1px solid var(--line); }
.day .d { color: var(--muted); font-size: 13px; white-space: nowrap; }
.day .p { overflow-wrap: anywhere; }
.day .p b { font-variant-numeric: tabular-nums; }
.day .a { font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ok); font-weight: 600; }
.day .a.miss { color: var(--muted); font-weight: 400; }
.day.now { background: var(--accent-soft); }
.day.now .d { color: var(--text); font-weight: 700; }
.day.fut .p { color: var(--text); }
.day.past .p { color: var(--muted); }

details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
details > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "▾"; color: var(--muted); }
details[open] > summary::after { content: "▴"; }
details > summary b { font-size: 14.5px; }
details .body { padding: 0 14px 6px; }
details .days { margin: 0 -14px -6px; }
.inner { border: none; background: none; border-radius: 0; margin: 6px 0 0; }
.inner > summary { padding: 6px 0; font-size: 13.5px; color: var(--muted); }
.inner ul { margin: 0 0 6px; padding-left: 18px; font-size: 13.5px; }

.note { border-radius: 10px; padding: 9px 12px; font-size: 13.5px; background: var(--panel); border: 1px solid var(--line); }
.note.warn { border-color: var(--warn); color: var(--warn); }
.lock label { display: block; font-weight: 600; margin-bottom: 6px; }
.lock input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.lock .err { color: var(--bad); margin-top: 8px; min-height: 1.4em; }
footer { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; padding: 2px; }
footer button { padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><h1>Treeniloki</h1><button id="refresh" aria-label="Päivitä">↻ Päivitä</button></header>
  <div id="app"><div class="note muted">Ladataan…</div></div>
  <footer><span class="muted small" id="status"></span><button id="forget" hidden>Vaihda tunnuslause</button></footer>
</main>
<script>
"use strict";
// Treenilokin puhelinsivu. data.json on salattu tilannekuva, jonka Treeniloki lähettää (mobiili.py).
// Purku: PBKDF2-HMAC-SHA256 -> salausavain + tarkisteavain; avainvirta HMAC-SHA256(avain, nonce || lohko).
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WD = ["su", "ma", "ti", "ke", "to", "pe", "la"];
const PREFIX = new TextEncoder().encode("treeniloki-v1");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* yksityinen selaus tms. */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ei haittaa */ } },
};

// ---- salaus ----
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...b));
const cat = (...a) => { const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let i = 0; for (const x of a) { o.set(x, i); i += x.length; } return o; };
async function deriveKey(pass, box) {
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC").trim()), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(box.salt), iterations: box.iter }, k, 512));
}
async function openBox(box, dk) {
  const hk = (raw, use) => crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, [use]);
  const salt = b64d(box.salt), nonce = b64d(box.nonce), ct = b64d(box.ct), tag = b64d(box.tag);
  if (!await crypto.subtle.verify("HMAC", await hk(dk.slice(32), "verify"), tag, cat(PREFIX, salt, nonce, ct))) throw new Error("tag");
  const ke = await hk(dk.slice(0, 32), "sign"), n = Math.ceil(ct.length / 32);
  const blocks = await Promise.all(Array.from({ length: n }, (_, i) =>
    crypto.subtle.sign("HMAC", ke, cat(nonce, new Uint8Array([i >>> 24, i >>> 16 & 255, i >>> 8 & 255, i & 255])))));
  const pt = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i++) pt[i] = ct[i] ^ new Uint8Array(blocks[i >> 5])[i & 31];
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---- apurit ----
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const at = s => new Date(s + "T12:00:00");
const add = (s, n) => { const d = at(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => add(s, -((at(s).getDay() + 6) % 7));
const dm = s => `${+s.slice(8, 10)}.${+s.slice(5, 7)}.`;
const wdm = s => `${WD[at(s).getDay()]} ${dm(s)}`;
const km = v => Number(v).toLocaleString("fi-FI", { maximumFractionDigits: 2 });
const num = (v, d = 1) => Number(v || 0).toLocaleString("fi-FI", { minimumFractionDigits: d, maximumFractionDigits: d });
const hm = m => `${Math.floor(Math.round(m) / 60)}:${String(Math.round(m) % 60).padStart(2, "0")}`;
function isoWeek(s) {
  const d = at(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4, 12);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
const what = p => p ? [p.what, p.dur, p.pace, p.note].filter(Boolean).join(" · ") : "";
const acts = r => (r.acts || []).map(a => `${esc(a.l)}${a.n ? " " + esc(a.n) : ""} ${hm(a.min)}${a.km >= .1 ? " · " + num(a.km) + " km" : ""}`).join("<br>");

// ---- näkymä ----
function dayRow(r, today) {
  const p = r.plan, cls = r.date === today ? "now" : r.date > today ? "fut" : "past", w = what(p);
  const done = r.acts && r.acts.length;
  const a = done ? (r.run_km >= .05 ? num(r.run_km) + " km ✓" : "✓") : r.date < today ? "–" : "";
  return `<div class="day ${cls}"><span class="d">${wdm(r.date)}</span>
    <span class="p">${p && p.km != null ? `<b>${km(p.km)} km</b>` : ""}${p && p.km != null && w ? " · " : ""}${esc(w)}${!p ? "<span class='muted'>–</span>" : ""}</span>
    <span class="a ${done ? "" : "miss"}">${a}</span></div>`;
}
function keyList(w) {
  const keys = ((w && w.key) || "").split("•").map(s => s.trim()).filter(Boolean);
  return keys.length ? `<details class="inner"><summary>Viikon avainharjoitukset</summary><ul>${keys.map(k => `<li>${esc(k)}</li>`).join("")}</ul></details>` : "";
}
function tiles(w) {
  if (!w || !w.t) return "";
  const a = w.a || {}, t = w.t;
  const tile = (lbl, val, tgt, r) => `<div class="tile"><div class="lbl">${lbl}</div><div class="v">${val} <small>/ ${tgt}</small></div>
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, (r || 0) * 100))}%"></i></div></div>`;
  const rat = (x, y) => y ? (x || 0) / y : (x ? 1 : 0);
  return `<div class="tiles">
    ${tile("Aika", hm(a.aika || 0), hm(t.aika || 0) + " h", rat(a.aika, t.aika))}
    ${tile("Juoksu", num(a.km), num(t.km, 0) + " km", rat(a.km, t.km))}
    ${tile("Pisin", num(a.pitka, 0), num(t.pitka, 0) + " min", rat(a.pitka, t.pitka))}
    ${tile("Laatu", a.laatu || 0, num(t.laatu, 0), rat(a.laatu, t.laatu))}
    ${tile("Voima", a.voima || 0, num(t.voima, 0), rat(a.voima, t.voima))}</div>`;
}
function render(state, offline) {
  const D = state.data, today = iso(new Date()), cur = monday(today);
  const byDate = {}, dayWeeks = {}, weekly = {};
  (D.days || []).forEach(w => { dayWeeks[w.week] = w; w.days.forEach(r => byDate[r.date] = r); });
  (D.weeks || []).forEach(w => weekly[w.week] = w);
  const hero = (title, date, main) => {
    const r = byDate[date], p = r && r.plan, w = what(p), done = r && r.acts && r.acts.length ? acts(r) : "";
    if (main) return `<section class="card today"><div class="lbl">${title} · ${wdm(date)}</div>
      ${p ? `${p.km != null ? `<div class="big">${km(p.km)} km</div>` : ""}${w ? `<div class="what">${esc(w)}</div>` : ""}` : `<div class="what muted">Ei ohjelmaa tälle päivälle</div>`}
      ${done ? `<div class="done"><b>Tehty ✓</b><br>${done}</div>` : ""}</section>`;
    return `<section class="card next"><div class="lbl">${title}${title ? " · " : ""}${wdm(date)}</div>
      <div class="big">${p ? [p.km != null ? km(p.km) + " km" : "", esc(w)].filter(Boolean).join(" · ") : "<span class='muted'>–</span>"}</div></section>`;
  };
  const head = (wk, extra) => `Viikko ${isoWeek(wk)} · ${dm(wk)}–${dm(add(wk, 6))}${extra || ""}`;
  const sub = (dw, ww) => [dw && dw.jakso || ww && ww.jakso, ww && ww.tyyppi].filter(Boolean).map(esc).join(" · ");
  const weekDays = dw => dw ? `<div class="days">${dw.days.map(r => dayRow(r, today)).join("")}</div>` : "";

  let html = hero("Tänään", today, true) + `<div class="pair">${hero("Huomenna", add(today, 1))}${hero("", add(today, 2))}</div>`;
  const cdw = dayWeeks[cur], cw = weekly[cur];
  if (cdw || cw) {
    const tgt = cdw ? [cdw.t_km != null ? km(cdw.t_km) + " km" : "", cdw.t_min != null ? hm(cdw.t_min) + " h" : ""].filter(Boolean).join(", ") : "";
    html += `<section class="card wk"><h2>${head(cur)}</h2><div class="sub">${[sub(cdw, cw), !cw && tgt ? "tavoite " + tgt : ""].filter(Boolean).join(" · ")}</div>
      ${tiles(cw)}${keyList(cw)}${weekDays(cdw)}</section>`;
  }
  const others = [...new Set([...Object.keys(dayWeeks), ...Object.keys(weekly)])].filter(w => w !== cur).sort();
  const block = (wk, open, title) => {
    const dw = dayWeeks[wk], ww = weekly[wk];
    const tgt = dw && dw.t_km != null ? km(dw.t_km) + " km" : ww && ww.t && ww.t.km != null ? num(ww.t.km, 0) + " km" : "";
    const tm = dw && dw.t_min != null ? hm(dw.t_min) + " h" : ww && ww.t && ww.t.aika != null ? hm(ww.t.aika) + " h" : "";
    return `<details ${open ? "open" : ""}><summary><span><b>${title || head(wk)}</b><br><span class="muted small">${[sub(dw, ww), [tgt, tm].filter(Boolean).join(", ")].filter(Boolean).join(" · ")}</span></span></summary>
      <div class="body">${wk < cur ? tiles(ww) : ""}${keyList(ww)}${weekDays(dw)}${!dw ? `<div class="muted small" style="padding:4px 0 8px">Päiväohjelmaa ei ole vielä tehty tälle viikolle.</div>` : ""}</div></details>`;
  };
  others.filter(w => w > cur).forEach((w, i) => html += block(w, i === 0));
  others.filter(w => w < cur).reverse().forEach(w => html += block(w, false, "Viime viikko · " + head(w)));
  if (D.warn && D.warn.length) html += `<div class="note warn">${D.warn.map(esc).join("<br>")}</div>`;

  const made = new Date(state.made), age = Math.round((at(today) - at(iso(made))) / 864e5);
  if (age >= 2) html = `<div class="note warn">Tilanne on ${age} päivää vanha. Se päivittyy, kun Treeniloki käynnistetään koneella.</div>` + html;
  if (!byDate[today] && !Object.keys(byDate).some(d => d > today)) html = `<div class="note warn">Päiväohjelma ei ulotu tähän päivään asti.</div>` + html;
  $("#app").innerHTML = html;
  $("#status").textContent = `Tilanne ${WD[made.getDay()]} ${made.getDate()}.${made.getMonth() + 1}. klo ${String(made.getHours()).padStart(2, "0")}.${String(made.getMinutes()).padStart(2, "0")}${offline ? " · ei yhteyttä, näytetään tallennettu" : ""}`;
  $("#forget").hidden = false;
}

// ---- lataus ----
let box = null;
function lock(msg) {
  $("#forget").hidden = true;
  $("#app").innerHTML = `<form class="card lock" id="lock"><label for="pw">Tunnuslause</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button class="primary" id="go">Avaa</button>
    <div class="muted small" style="margin-top:10px">Sama tunnuslause kuin Treenilokin asetuksissa (Mobiilinäkymä). Kysytään tällä laitteella vain kerran.</div>
    <div class="err" id="err">${esc(msg || "")}</div></form>`;
  $("#lock").onsubmit = async e => {
    e.preventDefault();
    const pw = $("#pw").value; if (!pw.trim()) return;
    $("#go").disabled = true; $("#err").textContent = "Avataan…";
    try {
      const dk = await deriveKey(pw, box), state = await openBox(box, dk);
      store.set("tl-key", b64e(dk)); render(state, false);
    } catch { $("#go").disabled = false; $("#err").textContent = "Tunnuslause ei täsmää."; }
  };
}
async function show(raw, offline) {
  box = JSON.parse(raw);
  const k = store.get("tl-key");
  if (!k) { if (!$("#lock")) lock(); return; }      // ei pyyhitä kesken olevaa kirjoitusta
  try { render(await openBox(box, b64d(k)), offline); }
  catch { store.del("tl-key"); lock("Tunnuslause on vaihdettu Treenilokissa. Anna uusi."); }
}
async function load() {
  const saved = store.get("tl-data");
  if (saved) await show(saved, false).catch(() => {});      // tallennettu tilanne heti näkyviin
  $("#refresh").disabled = true;
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "404" : "http");
    const raw = await r.text(); JSON.parse(raw);
    if (raw !== saved) { store.set("tl-data", raw); await show(raw, false); }
  } catch (e) {
    if (saved) await show(saved, true);
    else $("#app").innerHTML = `<div class="note">${e.message === "404"
      ? "Tilannekuvaa ei ole vielä lähetetty. Avaa Treeniloki koneella: ⚙ Asetukset → Mobiilinäkymä → Tallenna ja lähetä."
      : "Tilannekuvaa ei saatu ladattua. Tarkista verkkoyhteys ja yritä uudelleen."}</div>`;
  } finally { $("#refresh").disabled = false; }
}
$("#refresh").onclick = load;
$("#forget").onclick = () => { store.del("tl-key"); if (box) lock(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });      // päivä vaihtuu, sovellus palaa esiin
if ("serviceWorker" in navigator && !["127.0.0.1", "localhost"].includes(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!window.crypto || !crypto.subtle) $("#app").innerHTML = `<div class="note warn">Selain ei tue salauksen purkua tällä osoitteella (vaatii https-yhteyden).</div>`;
else load();
</script>
</body>
</html>
